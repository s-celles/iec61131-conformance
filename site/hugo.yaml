# Project site, deployed to GitHub Pages by .github/workflows/site.yml.
# Content is generated outside the repository by tools/site/sitegen.py;
# build with tools/site/build.sh OUT.
baseURL: https://s-celles.github.io/iec61131-conformance/
title: IEC 61131-3 conformance traces
languageCode: en
enableRobotsTXT: true
noBuildLock: true
disableKinds: [taxonomy, term]
module:
  imports:
    - path: github.com/s-celles/site-kit   # first: its badge and hooks win over Hextra's
    - path: github.com/imfing/hextra
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
menu:
  main:
    - name: Results
      pageRef: /results
      weight: 1
    - name: Findings
      pageRef: /findings
      weight: 2
    - name: Upstream
      pageRef: /upstream
      weight: 3
    - name: History
      pageRef: /history
      weight: 4
    - name: Methodology
      pageRef: /methodology
      weight: 5
    - name: Disclosure
      pageRef: /conflict-of-interest
      weight: 6
    - name: Docs
      pageRef: /docs
      weight: 7
    - name: GitHub
      url: https://github.com/s-celles/iec61131-conformance
      weight: 8
      params:
        icon: github
    - name: Search
      weight: 9
      params:
        type: search
params:
  description: IEC 61131-3 Structured Text conformance traces, run against the pinned open-source runtimes. An individual, non-commercial project.
  navbar:
    displayTitle: true
    logo:
      path: brand/scanard-mark.svg
      width: 32
      height: 32
  theme:
    default: system
    displayToggle: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  page:
    width: wide
  footer:
    displayCopyright: false
    displayPoweredBy: false
  siteKit:             # s-celles/site-kit: head, footer, badges (SPEC.md)
    themeColor: "#173f66"
    icon: brand/scanard-mark.svg
    badgeTones:        # one tone per status word (lower case), site-wide
      pass: good
      fail: bad
      error: warn-dashed
      same: info
      differs: alt
      fixed: good
      reported: info
      not reported: bad-dashed
      limitation: neutral
      not a defect: neutral
      open: warn
      closed: good
      merged: good
      not planned: neutral
      unknown: neutral
    footer: >-
      Individual, non-commercial project, not produced, endorsed or certified by IEC, PLCopen, any accredited or
      standards body, or the projects whose runtimes it runs; its aim is to help improve open-source IEC 61131-3
      implementations. The expected traces were derived by an AI assistant without access to the standard's text
      and may contain errors. Conflicts of interest and AI assistance are declared on
      [Conflict of interest](https://s-celles.github.io/iec61131-conformance/conflict-of-interest/). Public domain (CC0 1.0).
