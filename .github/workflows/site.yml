name: Site

# Builds the project site (Hugo + Hextra + s-celles/site-kit) from the
# repository, checks it against site-kit's SPEC and deploys it to GitHub
# Pages. The pages are generated by tools/site/sitegen.py at build time,
# outside the repository; see tools/site/build.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the History page reads notes/comparison.md over the git history
      - uses: actions/setup-go@v5     # Hugo fetches the Hextra module with Go
        with:
          go-version-file: site/go.mod
          cache-dependency-path: site/go.sum
      - name: Install pinned Hugo Extended
        run: bash tools/site/install_hugo.sh "$RUNNER_TEMP/hugo"
      - name: Generator checks
        run: python3 -I tools/site/test_sitegen.py
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || '' }}
        run: tools/site/build.sh "$RUNNER_TEMP/site" "$RUNNER_TEMP/hugo/hugo"
      - name: Site conforms to site-kit (SPEC.md of the tag pinned in site/go.mod)
        env:
          HUGO_ENVIRONMENT: production
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || '' }}
        run: |
          tag=$(sed -n 's#.*github.com/s-celles/site-kit \(v[0-9.]*\).*#\1#p' site/go.mod)
          git clone -q --depth 1 --branch "$tag" https://github.com/s-celles/site-kit "$RUNNER_TEMP/site-kit"
          python3 -I "$RUNNER_TEMP/site-kit/tools/check_site.py" --site "$RUNNER_TEMP/site/public" \
            --config site-kit.json --hugo site/hugo.yaml --repo .
          tools/site/build.sh "$RUNNER_TEMP/site-again" "$RUNNER_TEMP/hugo/hugo" >/dev/null
          python3 -I "$RUNNER_TEMP/site-kit/tools/compare_builds.py" "$RUNNER_TEMP/site/public" \
            "$RUNNER_TEMP/site-again/public" --config site-kit.json
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/site/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
