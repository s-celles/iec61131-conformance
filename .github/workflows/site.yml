name: Site

# Builds the project site (Hugo + Hextra) from the repository and deploys
# it to GitHub Pages. The pages are generated by tools/site/sitegen.py at
# build time, outside the repository; see tools/site/build.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5     # Hugo fetches the Hextra module with Go
        with:
          go-version-file: site/go.mod
          cache-dependency-path: site/go.sum
      - name: Install pinned Hugo Extended
        run: bash tools/site/install_hugo.sh "$RUNNER_TEMP/hugo"
      - name: Generator checks
        run: python3 -I tools/site/test_sitegen.py
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || '' }}
        run: tools/site/build.sh "$RUNNER_TEMP/site" "$RUNNER_TEMP/hugo/hugo"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/site/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
